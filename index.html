<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MÚSICA PLAYER</title>

  <!-- LIBRERÍA PARA LEER METADATOS Y CARÁTULAS DESDE EL ARCHIVO DE AUDIO -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    /* ==========================================
       1. ESTILOS GLOBALES Y RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #3C3C3B;
      color: #FFFFFF;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .header {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      padding-top: calc(18px + env(safe-area-inset-top, 18px));
      text-align: center;
      font-weight: bold;
      font-size: 1.25rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .header-separator {
      color: #FFFFFF;
      font-weight: bold;
      font-size: 1.25rem;
    }

    .header-btn {
      background-color: transparent;
      color: #FFFFFF;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .header-btn:active {
      opacity: 0.7;
    }

    /* ==========================================
       2. NAVEGACIÓN Y PANTALLAS
       ========================================== */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .screen.active {
      display: flex !important;
    }

    .view-content {
      flex: 1;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow: hidden;
      min-height: 0;
    }

    .btn-nav-back {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      border-radius: 12px;
      margin-top: 0;
      text-decoration: none;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .btn-nav-back:active {
      opacity: 0.8;
    }

    /* ==========================================
       3. PANTALLA PLAYLIST
       ========================================== */
    .playlist-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      height: calc((100dvh - 180px) / 7);
      min-height: 70px;
      padding: 2px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
      cursor: pointer;
      gap: 14px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .playlist-item:active {
      background-color: #4A4A49;
    }

    .playlist-thumb {
      width: 74px;
      height: 74px;
      border-radius: 10px;
      background-color: #9D9D9C;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 2.2rem;
    }

    .playlist-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .playlist-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-artist {
      font-size: 0.95rem;
      color: #9D9D9C;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      text-align: center;
      color: #9D9D9C;
      margin-top: 40px;
      font-size: 1.1rem;
      padding: 0 20px;
    }

    /* ==========================================
       4. REPRODUCTOR DE MÚSICA
       ========================================== */
    .player-view-drive {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      gap: 4px;
      flex: 1;
      width: 100%;
      min-height: 0;
      padding: 5px 15px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .album-cover-drive {
      width: 260px;
      height: 260px;
      background-color: #9D9D9C;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      flex-shrink: 0;
    }

    .track-details-drive { 
      text-align: center; 
      width: 100%; 
      margin-bottom: 10px;
    }

    .track-details-drive h3 { 
      font-size: 1.3rem; 
      font-weight: bold; 
      color: #FFFFFF; 
      margin-bottom: 4px; 
    }

    .track-details-drive p { 
      font-size: 1rem; 
      color: #9D9D9C; 
      margin-bottom: 2px;
    }

    .progress-bar-container { 
      width: 100%; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      margin-bottom: 2px;
    }

    .time-stamp { 
      font-size: 0.9rem; 
      font-weight: bold; 
      color: #FFFFFF; 
      width: 40px; 
    }

    .progress-bar { 
      flex: 1; 
      -webkit-appearance: none; 
      height: 6px; 
      background: linear-gradient(to right, #FF8C00 0%, #FF8C00 0%, #555555 0%, #555555 100%); 
      border-radius: 3px; 
    }

    .progress-bar::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      appearance: none; 
      width: 18px; 
      height: 18px; 
      border-radius: 50%; 
      background: #FF8C00; 
      cursor: pointer; 
    }

    .media-controls-square { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px; 
      width: 100%; 
    }

    .btn-square { 
      width: 75px; 
      height: 75px; 
      border-radius: 16px; 
      background-color: #9D9D9C; 
      color: #FFFFFF; 
      font-size: 2.2rem; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      font-weight: bold;
    }

    .btn-square.btn-square-main { 
      width: 85px !important; 
      height: 85px !important; 
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0 !important;
      margin: 0 !important;
      font-size: 2.5rem;
    }

    .btn-square-main.is-playing {
      background-color: #9D9D9C !important;
    }

    .btn-square-main.is-paused {
      background-color: #FF8C00 !important;
    }

    .btn-square-main.btn-shuffle-active {
      background-color: #FF8C00 !important;
    }

    .btn-square-main.btn-shuffle-inactive {
      background-color: #9D9D9C !important;
    }

    .shuffle-icon {
      width: 45px;
      height: 45px;
      fill: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- PANTALLA 1: PLAYLIST -->
    <div id="screen-playlist" class="screen active">
      <div class="header">
        <span class="header-separator">|</span>
        <button class="header-btn" onclick="ordenarAZ()">A-Z</button>
        <span class="header-separator">|</span>
        <button class="header-btn" onclick="ordenarPorAutor()">AUTOR</button>
        <span class="header-separator">|</span>
        <button class="header-btn" onclick="ordenarRandom()">RANDOM</button>
        <span class="header-separator">|</span>
      </div>
      <div class="view-content">
        <div class="playlist-container" id="playlist-list">
          <div class="empty-state">Buscando archivos de audio...</div>
        </div>
        <button class="btn-nav-back" onclick="salirDeAplicacion()">&lt; SALIR DE LA APLICACIÓN</button>
      </div>
    </div>

    <!-- PANTALLA 2: REPRODUCTOR -->
    <div id="screen-player" class="screen">
      <div class="header">REPRODUCIENDO</div>
      <div class="view-content">
        <div class="player-view-drive">
          <div class="album-cover-drive" id="player-cover">
            <span id="player-cover-icon" style="font-size: 5rem; color: #FFF;">🎵</span>
          </div>
          <div class="track-details-drive">
            <h3 id="player-song-title">Selecciona una canción</h3>
            <p id="player-artist-info"></p>
          </div>
          <div class="progress-bar-container">
            <span id="current-time" class="time-stamp">0:00</span>
            <input type="range" id="seek-bar" class="progress-bar" value="0" min="0" step="1">
            <span id="total-time" class="time-stamp" style="text-align: right;">0:00</span>
          </div>
          <div class="media-controls-square">
            <button class="btn-square" onclick="prevSongAZ()">⏮</button>
            <button class="btn-square btn-square-main is-playing" id="btn-toggle-play" onclick="togglePlayPause()">❚❚</button>
            <button class="btn-square btn-square-main btn-shuffle-inactive" id="btn-shuffle" onclick="toggleModoAleatorio()">
              <svg class="shuffle-icon" viewBox="0 0 24 24">
                <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
              </svg>
            </button>
            <button class="btn-square" onclick="nextSongAZ()">⏭</button>
          </div>
          <audio id="audio-element"></audio>
        </div>
        <button class="btn-nav-back" onclick="volverAPlaylist()">&lt; VOLVER A PLAYLIST</button>
      </div>
    </div>

  </div>

  <script>
    let todasLasCanciones = [];
    let colaAleatoria = [];
    let indiceCancionActualAZ = -1;
    let modoAleatorioActivo = false;

    const audioElement = document.getElementById('audio-element');
    const seekBar = document.getElementById('seek-bar');
    const btnPlayPause = document.getElementById('btn-toggle-play');
    const btnShuffle = document.getElementById('btn-shuffle');

    /* ==========================================
       GESTIÓN DE BASE DE DATOS INDEXEDDB
       ========================================== */
    let db = null;

    function abrirDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("MusicaPlayerDB", 1);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("metadatos")) {
            db.createObjectStore("metadatos", { keyPath: "path" });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e);
      });
    }

    async function obtenerMetaIndexedDB(path) {
      if (!db) await abrirDB();
      return new Promise((resolve) => {
        try {
          const tx = db.transaction("metadatos", "readonly");
          const store = tx.objectStore("metadatos");
          const req = store.get(path);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    async function guardarMetaIndexedDB(path, artista, portada) {
      if (!db) await abrirDB();
      try {
        const tx = db.transaction("metadatos", "readwrite");
        const store = tx.objectStore("metadatos");
        store.put({ path: path, artista: artista, portada: portada });
      } catch (e) {
        console.log("Error al guardar metadatos en IndexedDB", e);
      }
    }

    /* ==========================================
       CONTROL GENERAL Y NAVEGACIÓN
       ========================================== */
    function cambiarPantalla(idPantalla) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const pantallaObj = document.getElementById(idPantalla);
      if (pantallaObj) pantallaObj.classList.add('active');
    }

    function volverAPlaylist() {
      if (audioElement) {
        audioElement.pause();
      }
      actualizarEstadoPlayPause(false);
      cambiarPantalla('screen-playlist');
    }

    function salirDeAplicacion() {
      try {
        if (typeof window.AndroidBridge !== 'undefined' && window.AndroidBridge.salir) {
          window.AndroidBridge.salir();
        } else if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
          Capacitor.Plugins.App.exitApp();
        } else if (window.navigator && window.navigator.app && window.navigator.app.exitApp) {
          window.navigator.app.exitApp();
        } else {
          window.close();
        }
      } catch (e) {
        console.log("Error al salir de la aplicación:", e);
      }
    }

    function obtenerUrlFormateada(url) {
      if (!url) return '';
      if (url.startsWith('http') || url.startsWith('blob:') || url.startsWith('data:')) {
        return url;
      }
      if (typeof Capacitor !== 'undefined' && typeof Capacitor.convertFileSrc === 'function') {
        return Capacitor.convertFileSrc(url);
      }
      if (!url.startsWith('file://') && !url.startsWith('content://') && !url.startsWith('capacitor://')) {
        return 'file://' + url;
      }
      return url;
    }

    /* ==========================================
       ORDENACIÓN Y RENDERIZADO DE PLAYLIST
       ========================================== */
    function ordenarAZ() {
      todasLasCanciones.sort((a, b) => {
        const nombreA = (a.titulo || a.nombre || a.title || '').toLowerCase();
        const nombreB = (b.titulo || b.nombre || b.title || '').toLowerCase();
        return nombreA.localeCompare(nombreB);
      });
      reiniciarColaAleatoria();
      renderizarPlaylist();
    }

    function ordenarPorAutor() {
      todasLasCanciones.sort((a, b) => {
        const autorA = (a.artista || a.artist || 'Artista desconocido').toLowerCase();
        const autorB = (b.artista || b.artist || 'Artista desconocido').toLowerCase();
        return autorA.localeCompare(autorB);
      });
      reiniciarColaAleatoria();
      renderizarPlaylist();
    }

    function ordenarRandom() {
      todasLasCanciones = meclarArray(todasLasCanciones);
      reiniciarColaAleatoria();
      renderizarPlaylist();
    }

    async function renderizarPlaylist() {
      const contenedor = document.getElementById('playlist-list');
      if (!contenedor) return;
      contenedor.innerHTML = '';

      if (todasLasCanciones.length === 0) {
        contenedor.innerHTML = '<div class="empty-state">No se encontraron archivos de música en el dispositivo.</div>';
        return;
      }

      for (let index = 0; index < todasLasCanciones.length; index++) {
        const cancion = todasLasCanciones[index];
        const item = document.createElement('div');
        item.className = 'playlist-item';

        const nombre = cancion.titulo || cancion.nombre || cancion.title || 'Canción desconocida';
        const rawUrl = cancion.archivo || cancion.path || cancion.url || '';
        
        const cached = await obtenerMetaIndexedDB(rawUrl);
        if (cached) {
          if (cached.artista) cancion.artista = cached.artista;
          if (cached.portada) cancion.portada = cached.portada;
        }

        const artista = cancion.artista || cancion.artist || 'Artista desconocido';

        item.innerHTML = `
          <div class="playlist-thumb" id="thumb-${index}">🎵</div>
          <div class="playlist-info">
            <div class="playlist-title">${nombre}</div>
            <div class="playlist-artist" id="artist-playlist-${index}">${artista}</div>
          </div>
        `;

        item.onclick = () => {
          indiceCancionActualAZ = index;
          playSong(cancion);
          cambiarPantalla('screen-player');
        };

        contenedor.appendChild(item);

        if (cancion.portada) {
          asignarImagenThumb(index, cancion.portada);
        } else {
          extraerMetadatosParaPlaylist(cancion, index, rawUrl);
        }
      }
    }

    function asignarImagenThumb(index, fuenteImg) {
      const thumbElem = document.getElementById(`thumb-${index}`);
      if (thumbElem) {
        let srcImg = fuenteImg;
        if (srcImg.length > 100 && !srcImg.startsWith('data:') && !srcImg.startsWith('http') && !srcImg.startsWith('file:')) {
          srcImg = 'data:image/jpeg;base64,' + srcImg;
        }
        thumbElem.style.backgroundImage = `url('${srcImg}')`;
        thumbElem.innerText = '';
      }
    }

    function extraerMetadatosParaPlaylist(songObj, index, rawUrl) {
      if (typeof jsmediatags === 'undefined' || !rawUrl) return;

      let formattedUrl = obtenerUrlFormateada(rawUrl);

      jsmediatags.read(formattedUrl, {
        onSuccess: function(tag) {
          const tags = tag.tags || {};
          let artExtraido = tags.artist || '';
          let coverExtraida = '';

          if (artExtraido) {
            songObj.artista = artExtraido;
            const artistElem = document.getElementById(`artist-playlist-${index}`);
            if (artistElem) artistElem.innerText = artExtraido;
          }

          const picture = tags.picture;
          if (picture) {
            let base64String = "";
            for (let i = 0; i < picture.data.length; i++) {
              base64String += String.fromCharCode(picture.data[i]);
            }
            coverExtraida = "data:" + picture.format + ";base64," + window.btoa(base64String);
            songObj.portada = coverExtraida;
            asignarImagenThumb(index, coverExtraida);
          }

          guardarMetaIndexedDB(rawUrl, artExtraido, coverExtraida);
        },
        onError: function() {
          if (formattedUrl !== rawUrl) {
            jsmediatags.read(rawUrl, {
              onSuccess: function(tag) {
                const tags = tag.tags || {};
                let artExtraido = tags.artist || '';
                let coverExtraida = '';

                if (artExtraido) {
                  songObj.artista = artExtraido;
                  const artistElem = document.getElementById(`artist-playlist-${index}`);
                  if (artistElem) artistElem.innerText = artExtraido;
                }

                const picture = tags.picture;
                if (picture) {
                  let base64String = "";
                  for (let i = 0; i < picture.data.length; i++) {
                    base64String += String.fromCharCode(picture.data[i]);
                  }
                  coverExtraida = "data:" + picture.format + ";base64," + window.btoa(base64String);
                  songObj.portada = coverExtraida;
                  asignarImagenThumb(index, coverExtraida);
                }

                guardarMetaIndexedDB(rawUrl, artExtraido, coverExtraida);
              }
            });
          }
        }
      });
    }

    /* ==========================================
       ESCANEO Y PERMISOS DE ALMACENAMIENTO
       ========================================== */
    async function solicitarPermisosYEscanear() {
      await abrirDB();

      // Solicitud de permisos en Capacitor si está presente
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem) {
        try {
          if (Capacitor.Plugins.Filesystem.requestPermissions) {
            await Capacitor.Plugins.Filesystem.requestPermissions();
          }
        } catch (err) {
          console.log("Error al pedir permisos:", err);
        }
      }

      // 1. Método nativo Android Bridge
      if (typeof window.AndroidBridge !== 'undefined' && typeof window.AndroidBridge.cargarMusica === 'function') {
        window.AndroidBridge.cargarMusica();
        return;
      }
      
      // 2. Método Capacitor Filesystem
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem) {
        try {
          const result = await Capacitor.Plugins.Filesystem.readdir({
            path: 'MiMusica',
            directory: 'EXTERNAL_STORAGE'
          });

          if (result && result.files && result.files.length > 0) {
            const archivosEncontrados = [];
            result.files.forEach(file => {
              const nombreArchivo = typeof file === 'string' ? file : file.name;
              if (nombreArchivo.toLowerCase().endsWith('.mp3') || nombreArchivo.toLowerCase().endsWith('.m4a') || nombreArchivo.toLowerCase().endsWith('.wav')) {
                const rutaCompleta = '/storage/emulated/0/MiMusica/' + nombreArchivo;
                archivosEncontrados.push({
                  nombre: nombreArchivo.replace(/\.[^/.]+$/, ""),
                  archivo: rutaCompleta,
                  album: 'MiMusica'
                });
              }
            });

            if (archivosEncontrados.length > 0) {
              todasLasCanciones = archivosEncontrados;
              ordenarAZ();
              return;
            }
          }
        } catch (e) {
          console.log("Error al leer directorio directamente:", e);
        }
      }

      // 3. Fallback de pruebas si no se cargan archivos
      renderizarPlaylist();
    }

    window.recibirBibliotecaNativa = async function(bibliotecaRecibida, coversRecibidas) {
      const cancionesExtraidas = [];
      const mapaCovers = coversRecibidas || {};
      
      if (Array.isArray(bibliotecaRecibida)) {
        bibliotecaRecibida.forEach(item => {
          if (typeof item === 'object' && item !== null) {
            cancionesExtraidas.push(item);
          } else {
            cancionesExtraidas.push({
              nombre: String(item),
              archivo: String(item).startsWith('/') ? String(item) : '/storage/emulated/0/MiMusica/' + String(item),
              album: 'MiMusica'
            });
          }
        });
      } else if (typeof bibliotecaRecibida === 'object' && bibliotecaRecibida !== null) {
        Object.keys(bibliotecaRecibida).forEach(album => {
          const lista = bibliotecaRecibida[album];
          if (Array.isArray(lista)) {
            lista.forEach(item => {
              if (typeof item === 'object' && item !== null) {
                if (!item.album) item.album = album;
                cancionesExtraidas.push(item);
              } else {
                const claveAlbum = album.toLowerCase();
                cancionesExtraidas.push({
                  nombre: String(item),
                  archivo: String(item).startsWith('/') ? String(item) : '/storage/emulated/0/MiMusica/' + String(item),
                  album: album,
                  portada: mapaCovers[claveAlbum] || ''
                });
              }
            });
          }
        });
      }

      if (cancionesExtraidas.length > 0) {
        todasLasCanciones = cancionesExtraidas;
        ordenarAZ();
      } else {
        renderizarPlaylist();
      }
    };

    /* ==========================================
       NAVEGACIÓN DE CANCIONES Y SHUFFLE
       ========================================== */
    function meclarArray(array) {
      const copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function reiniciarColaAleatoria() {
      if (todasLasCanciones.length === 0) return;
      colaAleatoria = meclarArray(todasLasCanciones);
    }

    function toggleModoAleatorio() {
      modoAleatorioActivo = !modoAleatorioActivo;
      if (btnShuffle) {
        if (modoAleatorioActivo) {
          btnShuffle.classList.remove('btn-shuffle-inactive');
          btnShuffle.classList.add('btn-shuffle-active');
        } else {
          btnShuffle.classList.remove('btn-shuffle-active');
          btnShuffle.classList.add('btn-shuffle-inactive');
        }
      }
    }

    function siguienteCancionAleatoria() {
      if (todasLasCanciones.length === 0) return;

      if (colaAleatoria.length === 0) {
        reiniciarColaAleatoria();
      }

      const proximaCancion = colaAleatoria.shift();
      indiceCancionActualAZ = todasLasCanciones.indexOf(proximaCancion);

      playSong(proximaCancion);
    }

    function prevSongAZ() {
      if (todasLasCanciones.length === 0) return;
      
      if (modoAleatorioActivo) {
        siguienteCancionAleatoria();
        return;
      }

      if (indiceCancionActualAZ > 0) {
        indiceCancionActualAZ--;
      } else {
        indiceCancionActualAZ = todasLasCanciones.length - 1;
      }
      playSong(todasLasCanciones[indiceCancionActualAZ]);
    }

    function nextSongAZ() {
      if (todasLasCanciones.length === 0) return;

      if (modoAleatorioActivo) {
        siguienteCancionAleatoria();
        return;
      }

      if (indiceCancionActualAZ < todasLasCanciones.length - 1) {
        indiceCancionActualAZ++;
      } else {
        indiceCancionActualAZ = 0;
      }
      playSong(todasLasCanciones[indiceCancionActualAZ]);
    }

    /* ==========================================
       CONTROLES DE REPRODUCCIÓN (PLAY / PAUSE)
       ========================================== */
    function togglePlayPause() {
      if (!audioElement) return;
      if (audioElement.paused) {
        audioElement.play().then(() => {
          actualizarEstadoPlayPause(true);
        }).catch(err => console.log(err));
      } else {
        audioElement.pause();
        actualizarEstadoPlayPause(false);
      }
    }

    function actualizarEstadoPlayPause(estaSonando) {
      if (btnPlayPause) {
        if (estaSonando) {
          btnPlayPause.innerText = '❚❚';
          btnPlayPause.classList.remove('is-paused');
          btnPlayPause.classList.add('is-playing');
        } else {
          btnPlayPause.innerText = '▶';
          btnPlayPause.classList.remove('is-playing');
          btnPlayPause.classList.add('is-paused');
        }
      }
    }
