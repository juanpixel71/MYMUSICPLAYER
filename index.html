<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MÚSICA PLAYER</title>

  <!-- LIBRERÍA PARA LEER METADATOS Y CARÁTULAS DESDE EL ARCHIVO DE AUDIO -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    /* ==========================================
       1. ESTILOS GLOBALES Y RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #3C3C3B;
      color: #FFFFFF;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .header {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      padding-top: calc(18px + env(safe-area-inset-top, 18px));
      text-align: center;
      font-weight: bold;
      font-size: 1.25rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ESTILOS BOTONES DEL HEADER EN PLAYLIST */
    .header-playlist-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .header-btn {
      background: transparent;
      color: #FFFFFF;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      padding: 0 6px;
      text-transform: uppercase;
      transition: opacity 0.2s, color 0.2s;
    }

    .header-btn:active {
      opacity: 0.7;
    }

    .header-btn.active-order {
      color: #3C3C3B;
    }

    .header-separator {
      color: #FFFFFF;
      font-weight: normal;
      user-select: none;
    }

    /* ==========================================
       2. NAVEGACIÓN Y PANTALLAS
       ========================================== */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .screen.active {
      display: flex !important;
    }

    .view-content {
      flex: 1;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow: hidden;
      min-height: 0;
    }

    .btn-nav-back {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      border-radius: 12px;
      margin-top: 0;
      text-decoration: none;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .btn-nav-back:active {
      opacity: 0.8;
    }

    /* ==========================================
       3. PANTALLA PLAYLIST (7 FILAS CON CARÁTULAS MÁS GRANDES)
       ========================================== */
    .playlist-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      height: calc((100dvh - 180px) / 7);
      min-height: 70px;
      padding: 2px 4px; /* Padding vertical reducido al mínimo */
      border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
      cursor: pointer;
      gap: 14px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .playlist-item:active {
      background-color: #4A4A49;
    }

    .playlist-thumb {
      width: 74px; /* Carátula más grande */
      height: 74px; /* Carátula más grande */
      border-radius: 10px;
      background-color: #9D9D9C;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 2.2rem;
    }

    .playlist-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .playlist-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-artist {
      font-size: 0.95rem;
      color: #9D9D9C;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================
       4. REPRODUCTOR DE MÚSICA (SCREEN-PLAYER)
       ========================================== */
    .player-view-drive {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      gap: 4px;
      flex: 1;
      width: 100%;
      min-height: 0;
      padding: 5px 15px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .album-cover-drive {
      width: 260px;
      height: 260px;
      background-color: #9D9D9C;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      flex-shrink: 0;
      margin-top: 0;
      margin-bottom: 0;
    }

    .track-details-drive { 
      text-align: center; 
      width: 100%; 
      margin-bottom: 10px;
    }

    .track-details-drive h3 { 
      font-size: 1.3rem; 
      font-weight: bold; 
      color: #FFFFFF; 
      margin-bottom: 4px; 
    }

    .track-details-drive p { 
      font-size: 1rem; 
      color: #9D9D9C; 
      margin-bottom: 2px;
    }

    .progress-bar-container { 
      width: 100%; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      margin-bottom: 2px;
    }

    .time-stamp { 
      font-size: 0.9rem; 
      font-weight: bold; 
      color: #FFFFFF; 
      width: 40px; 
    }

    .progress-bar { 
      flex: 1; 
      -webkit-appearance: none; 
      height: 6px; 
      background: linear-gradient(to right, #FF8C00 0%, #FF8C00 0%, #555555 0%, #555555 100%); 
      border-radius: 3px; 
    }

    .progress-bar::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      appearance: none; 
      width: 18px; 
      height: 18px; 
      border-radius: 50%; 
      background: #FF8C00; 
      cursor: pointer; 
    }

    .media-controls-square { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px; 
      width: 100%; 
      margin-top: 0;
      margin-bottom: 0;
    }

    .btn-square { 
      width: 75px; 
      height: 75px; 
      border-radius: 16px; 
      background-color: #9D9D9C; 
      color: #FFFFFF; 
      font-size: 2.2rem; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      font-weight: bold;
    }

    .btn-square.btn-square-main { 
      width: 85px !important; 
      height: 85px !important; 
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0 !important;
      margin: 0 !important;
      font-size: 2.5rem;
    }

    .btn-square-main.is-playing {
      background-color: #9D9D9C !important;
    }

    .btn-square-main.is-paused {
      background-color: #FF8C00 !important;
    }

    .btn-square-main.btn-shuffle-orange {
      background-color: #FF8C00 !important;
    }

    .btn-square-main.btn-shuffle-off {
      background-color: #9D9D9C !important;
    }

    .shuffle-icon {
      width: 45px;
      height: 45px;
      fill: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- PANTALLA 1: PLAYLIST -->
    <div id="screen-playlist" class="
