<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MÚSICA PLAYER</title>

  <style>
    /* ==========================================
       1. ESTILOS GLOBALES Y RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #3C3C3B;
      color: #FFFFFF;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .header {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      padding-top: calc(20px + env(safe-area-inset-top, 20px));
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    /* ==========================================
       2. NAVEGACIÓN Y PANTALLAS
       ========================================== */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .screen.active {
      display: flex !important;
    }

    .view-content {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
    }

    .btn-nav-back {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 10px;
      margin-top: 0;
      text-decoration: none;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .btn-nav-back:active {
      opacity: 0.8;
    }

    /* ==========================================
       3. REPRODUCTOR DE MÚSICA (SCREEN-PLAYER)
       ========================================== */
    .player-view-drive {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      gap: 4px;
      flex: 1;
      width: 100%;
      min-height: 0;
      padding: 5px 15px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .album-cover-drive {
      width: 260px;
      height: 260px;
      background-color: #9D9D9C;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      flex-shrink: 0;
      margin-top: 0;
      margin-bottom: 0;
    }

    .track-details-drive { 
      text-align: center; 
      width: 100%; 
      margin-bottom: 10px;
    }

    .track-details-drive h3 { 
      font-size: 1.3rem; 
      font-weight: bold; 
      color: #FFFFFF; 
      margin-bottom: 4px; 
    }

    .track-details-drive p { 
      font-size: 1rem; 
      color: #9D9D9C; 
    }

    .progress-bar-container { 
      width: 100%; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      margin-bottom: 2px;
    }

    .time-stamp { 
      font-size: 0.9rem; 
      font-weight: bold; 
      color: #FFFFFF; 
      width: 40px; 
    }

    .progress-bar { 
      flex: 1; 
      -webkit-appearance: none; 
      height: 6px; 
      background: #555555; 
      border-radius: 3px; 
    }

    .progress-bar::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      appearance: none; 
      width: 18px; 
      height: 18px; 
      border-radius: 50%; 
      background: #FF8C00; 
      cursor: pointer; 
    }

    .media-controls-square { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 20px; 
      width: 100%; 
      margin-top: 0;
      margin-bottom: 0;
    }

    .btn-square { 
      width: 95px; 
      height: 95px; 
      border-radius: 16px; 
      background-color: #9D9D9C; 
      color: #FFFFFF; 
      font-size: 2.8rem; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
    }

    .btn-square.btn-square-main { 
      width: 110px; 
      height: 110px; 
      background-color: #FF8C00 !important; 
      background-image: none !important;
      box-shadow: none !important;
      -webkit-appearance: none !important;
      font-size: 4rem; 
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      line-height: 1 !important;
      padding-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- REPRODUCTOR -->
    <div id="screen-player" class="screen active">
      <div class="header">REPRODUCIENDO</div>
      <div class="view-content">
        <div class="player-view-drive">
          <div class="album-cover-drive" id="player-cover">
            <span id="player-cover-icon" style="font-size: 5rem; color: #FFF;">🎵</span>
          </div>
          <div class="track-details-drive">
            <h3 id="player-song-title">Canción</h3>
            <p id="player-album-info">Álbum</p>
          </div>
          <div class="progress-bar-container">
            <span id="current-time" class="time-stamp">0:00</span>
            <input type="range" id="seek-bar" class="progress-bar" value="0" min="0" step="1">
            <span id="total-time" class="time-stamp" style="text-align: right;">0:00</span>
          </div>
          <div class="media-controls-square">
            <button class="btn-square" onclick="prevSong()">⏮</button>
            <button class="btn-square btn-square-main" id="btn-play-pause" onclick="siguienteCancionAleatoria()">⇄</button>
            <button class="btn-square" onclick="nextSong()">⏭</button>
          </div>
          <audio id="audio-element"></audio>
        </div>
        <button class="btn-nav-back" onclick="salirDeAplicacion()">&lt; SALIR DE LA APLICACIÓN</button>
      </div>
    </div>

  </div>

  <script>
    /* ==========================================
       VARIABLES GLOBALES Y ELEMENTOS DOM
       ========================================== */
    let todasLasCanciones = [];
    let colaAleatoria = [];
    let historialReproducción = [];
    let indiceHistorial = -1;

    const audioElement = document.getElementById('audio-element');
    const seekBar = document.getElementById('seek-bar');

    /* ==========================================
       CONTROL GENERAL Y NAVEGACIÓN
       ========================================== */
    function salirDeAplicacion() {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
        Capacitor.Plugins.App.exitApp();
      } else if (navigator.app && navigator.app.exitApp) {
        navigator.app.exitApp();
      } else {
        window.close();
      }
    }

    /* ==========================================
       CARGA DE ARCHIVOS Y RECEPCIÓN NATIVA
       ========================================== */
    function cargarMusicaInicial() {
      if (typeof window.AndroidBridge !== 'undefined' && typeof window.AndroidBridge.cargarMusica === 'function') {
        window.AndroidBridge.cargarMusica();
      }
    }

    window.recibirBibliotecaNativa = function(bibliotecaRecibida, coversRecibidas) {
      const cancionesExtraidas = [];
      const mapaCovers = coversRecibidas || {};
      
      if (Array.isArray(bibliotecaRecibida)) {
        cancionesExtraidas.push(...bibliotecaRecibida);
      } else if (typeof bibliotecaRecibida === 'object' && bibliotecaRecibida !== null) {
        Object.keys(bibliotecaRecibida).forEach(album => {
          const lista = bibliotecaRecibida[album];
          if (Array.isArray(lista)) {
            lista.forEach(item => {
              if (typeof item === 'object' && item !== null) {
                if (!item.album) item.album = album;
                cancionesExtraidas.push(item);
              } else {
                const claveAlbum = album.toLowerCase();
                cancionesExtraidas.push({
                  nombre: String(item),
                  archivo: String(item),
                  album: album,
                  portada: mapaCovers[claveAlbum] || ''
                });
              }
            });
          }
        });
      }

      if (cancionesExtraidas.length > 0) {
        todasLasCanciones = cancionesExtraidas;
        reiniciarColaAleatoria();
        siguienteCancionAleatoria();
      }
    };

    /* ==========================================
       LÓGICA DE MODO ALEATORIO (SHUFFLE DOCK)
       ========================================== */
    function meclarArray(array) {
      const copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function reiniciarColaAleatoria() {
      if (todasLasCanciones.length === 0) return;
      colaAleatoria = meclarArray(todasLasCanciones);
    }

    function siguienteCancionAleatoria() {
      if (todasLasCanciones.length === 0) return;

      if (indiceHistorial < historialReproducción.length - 1) {
        indiceHistorial++;
        playSong(historialReproducción[indiceHistorial]);
        return;
      }

      if (colaAleatoria.length === 0) {
        reiniciarColaAleatoria();
      }

      const proximaCancion = colaAleatoria.shift();
      historialReproducción.push(proximaCancion);
      indiceHistorial = historialReproducción.length - 1;

      playSong(proximaCancion);
    }

    function prevSong() {
      if (historialReproducción.length === 0) return;
      if (indiceHistorial > 0) {
        indiceHistorial--;
        playSong(historialReproducción[indiceHistorial]);
      }
    }

    function nextSong() {
      siguienteCancionAleatoria();
    }

    /* ==========================================
       REPRODUCCIÓN Y METADATOS (CARÁTULA, TÍTULO, ÁLBUM)
       ========================================== */
    function procesarUrlImagen(imagenRaw) {
      if (!imagenRaw) return '';
      let urlImg = String(imagenRaw).trim();

      // Si viene en Base64 sin cabecera Data URL
      if (!urlImg.startsWith('http') && !urlImg.startsWith('data:') && !urlImg.startsWith('file:') && !urlImg.startsWith('content:') && !urlImg.startsWith('capacitor:')) {
        if (urlImg.length > 100) {
          urlImg = 'data:image/jpeg;base64,' + urlImg;
        }
      }

      // Tratamiento de rutas nativas Android / Capacitor
      if (urlImg && !urlImg.startsWith('http') && !urlImg.startsWith('data:')) {
        if (typeof Capacitor !== 'undefined' && typeof Capacitor.convertFileSrc === 'function') {
          urlImg = Capacitor.convertFileSrc(urlImg);
        } else if (!urlImg.startsWith('file://') && !urlImg.startsWith('content://') && !urlImg.startsWith('capacitor://')) {
          urlImg = 'file://' + urlImg;
        }
      }

      return urlImg;
    }

    function playSong(song) {
      if (!song) return;

      let nombre = '';
      let album = '';
      let url = '';
      let portadaRaw = '';

      if (typeof song === 'object' && song !== null) {
        nombre = song.titulo || song.nombre || song.title || '';
        album = song.album || song.albumName || '';
        url = song.archivo || song.path || song.url || '';
        portadaRaw = song.portada || song.cover || song.art || song.imagen || song.caratula || song.albumArt || song.coverUri || '';

        if (!nombre && url) {
          const nombreLimpio = url.split('/').pop().split('\\').pop();
          nombre = nombreLimpio.substring(0, nombreLimpio.lastIndexOf('.')) || nombreLimpio;
        }
      } else {
        const urlStr = String(song);
        const nombreLimpio = urlStr.split('/').pop().split('\\').pop();
        nombre = nombreLimpio.substring(0, nombreLimpio.lastIndexOf('.')) || nombreLimpio;
        url = urlStr;
      }

      if (!nombre) nombre = 'Canción desconocida';
      if (!album) album = 'Álbum desconocido';

      if (url && !url.startsWith('http') && !url.startsWith('blob:') && !url.startsWith('data:')) {
        if (typeof Capacitor !== 'undefined' && typeof Capacitor.convertFileSrc === 'function') {
          url = Capacitor.convertFileSrc(url);
        } else if (!url.startsWith('file://') && !url.startsWith('content://') && !url.startsWith('capacitor://')) {
          url = 'file://' + url;
        }
      }

      // Actualizar UI - Título y Álbum
      const titleElem = document.getElementById('player-song-title');
      const infoElem = document.getElementById('player-album-info');
      if (titleElem) titleElem.innerText = nombre;
      if (infoElem) infoElem.innerText = album;

      // Actualizar UI - Carátula procesada
      const playerCover = document.getElementById('player-cover');
      const playerCoverIcon = document.getElementById('player-cover-icon');
      const portadaProcesada = procesarUrlImagen(portadaRaw);

      if (playerCover && playerCoverIcon) {
        if (portadaProcesada) {
          playerCover.style.backgroundImage = `url('${portadaProcesada}')`;
          playerCoverIcon.style.display = 'none';
        } else {
          playerCover.style.backgroundImage = 'none';
          playerCoverIcon.style.display = 'block';
        }
      }

      // Reproducción de audio
      if (audioElement) {
        audioElement.pause();
        audioElement.src = url;
        audioElement.load();
        
        audioElement.play().catch(error => {
          console.log("Error al reproducir audio:", error);
        });
      }
    }

    /* ==========================================
       EVENTOS DE AUDIO Y BARRA DE PROGRESO
       ========================================== */
    if (audioElement) {
      audioElement.addEventListener('ended', () => {
        siguienteCancionAleatoria();
      });

      audioElement.addEventListener('timeupdate', () => {
        if (!isNaN(audioElement.duration) && seekBar) {
          seekBar.max = Math.floor(audioElement.duration);
          seekBar.value = Math.floor(audioElement.currentTime);
          const currTime = document.getElementById('current-time');
          const totTime = document.getElementById('total-time');
          if (currTime) currTime.innerText = formatTime(audioElement.currentTime);
          if (totTime) totTime.innerText = formatTime(audioElement.duration);
        }
      });
    }

    if (seekBar) {
      seekBar.addEventListener('input', () => { 
        if (audioElement) audioElement.currentTime = seekBar.value; 
      });
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      let min = Math.floor(seconds / 60);
      let sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarMusicaInicial();
    });
  </script>
</body>
</html>
