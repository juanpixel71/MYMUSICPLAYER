name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar carpeta web (Build)
        run: npm run build

      - name: Añadir plataforma Android
        run: npx cap add android

      - name: Configurar Icono de la App
        run: |
          npm install -g @capacitor/assets
          npx cap-assets generate --iconAvailable --icon icon.png || true

      - name: Copiar MainActivity Java Personalizada
        run: |
          PACKAGE_PATH="android/app/src/main/java/com/mitotalplayer/app"
          mkdir -p $PACKAGE_PATH
          cat << 'EOF' > $PACKAGE_PATH/MainActivity.java
          package com.mitotalplayer.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams layoutParams = getWindow().getAttributes();
                      layoutParams.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(layoutParams);
                  }
              }
          }
          EOF

      - name: Configurar Permisos en AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' $MANIFEST

      - name: Sincronizar proyecto Capacitor
        run: npx cap sync

      - name: Compilar APK de Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiTotalPlayer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
